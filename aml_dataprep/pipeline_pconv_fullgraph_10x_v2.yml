$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: lrm-l800-pconv-fullgraph-10x-v2
experiment_name: lrm-l800-pconv-fullgraph-10x
description: >-
