$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: lrm-l800-pconv-v3-parallel-cpu-prep
experiment_name: lrm-l800-pipeline
description: >-
  Phase 1 CPU-prep scaffold for parallel pconv v3 data prep. This file avoids
  uncertain AML v2 parallel-job schema by wiring real command scripts and
  documenting fanout boundaries. Expand fanout jobs from manifests before a full
  submission; this scaffold must not submit encode/train/AML jobs by itself.

settings:
  default_compute: azureml:CPU-D2ADSV4
  continue_on_step_failure: false

inputs:
  data_version: v3-20260624-pconv-parallel-prep
  layout_version: layout_v1
  source_root: azureml://subscriptions/72a0fe10-0a76-4898-9b7b-640e6e236fdc/resourcegroups/wb-aml/workspaces/pconv-aml-offline/datastores/bingads_algo_pipelines_c08/paths/local/User/wenhlu/LRM_benchmark_v4

outputs:
  discovered:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/discovered
  raw:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/raw
  vocab_spill:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/vocab_spill
  vocab_reduced:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/vocab_reduced
  vocab_offsets:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/vocab_offsets
  vocab:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/vocab
  vocab_finalize_markers:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/vocab_finalize_markers
  seqview:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/seqview
  seqview_metadata:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/seqview_metadata
  embeddings:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/embeddings
  train_output:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/train_output
  eval_output:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/${{parent.inputs.data_version}}/${{parent.inputs.layout_version}}/eval_output

jobs:
  discover_raw_shards:
    type: command
    display_name: discover-raw-shards
    compute: azureml:CPU-D2ADSV4
    identity:
      type: user_identity
    environment: azureml:lrm-relay-env:2
    code: ..
    inputs:
      source_root: ${{parent.inputs.source_root}}
      data_version: ${{parent.inputs.data_version}}
    outputs:
      discovered: ${{parent.outputs.discovered}}
    command: >-
      python aml_dataprep/parallel/discover_raw_shards.py
      --source_root ${{inputs.source_root}}
      --data_version ${{inputs.data_version}}
      --output_dir ${{outputs.discovered}}

  relay_parallel_fanout_boundary:
    type: command
    display_name: relay-parallel-fanout-boundary
    compute: azureml:CPU-ECONVDDA
    environment: azureml:lrm-relay-env:2
    code: ..
    inputs:
      discovered: ${{parent.jobs.discover_raw_shards.outputs.discovered}}
    outputs:
      raw: ${{parent.outputs.raw}}
    command: >-
      python aml_dataprep/parallel/run_smoke_subset.py
      --stage relay
      --manifest ${{inputs.discovered}}/raw_source_manifest.jsonl
      --raw_out ${{outputs.raw}}
      --max_train_shards 1
      --max_val_shards 1
      --max_lines 1000

  vocab_spill_parallel_fanout_boundary:
    type: command
    display_name: vocab-spill-parallel-fanout-boundary
    compute: azureml:CPU-D2ADSV4
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
      conda_file:
        name: phase1-fanout-doc
        channels: [conda-forge]
        dependencies:
          - python=3.10
    code: ..
    inputs:
      discovered: ${{parent.jobs.discover_raw_shards.outputs.discovered}}
      raw: ${{parent.jobs.relay_parallel_fanout_boundary.outputs.raw}}
    outputs:
      spill: ${{parent.outputs.vocab_spill}}
    command: >-
      python aml_dataprep/parallel/run_smoke_subset.py
      --stage spill
      --manifest ${{inputs.discovered}}/raw_source_manifest.jsonl
      --raw_root ${{inputs.raw}}
      --spill_out ${{outputs.spill}}
      --num_buckets 64
      --max_train_shards 1
      --max_val_shards 1

  vocab_reduce_parallel_fanout_boundary:
    type: command
    display_name: vocab-reduce-parallel-fanout-boundary
    compute: azureml:CPU-ECONVDDA
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
      conda_file:
        name: phase1-fanout-doc
        channels: [conda-forge]
        dependencies:
          - python=3.10
    code: ..
    inputs:
      spill: ${{parent.jobs.vocab_spill_parallel_fanout_boundary.outputs.spill}}
    outputs:
      reduced: ${{parent.outputs.vocab_reduced}}
    command: >-
      python aml_dataprep/parallel/run_smoke_subset.py
      --stage reduce
      --spill_root ${{inputs.spill}}
      --reduced_out ${{outputs.reduced}}
      --num_buckets 64

  vocab_prefix_sum:
    type: command
    display_name: vocab-prefix-sum
    compute: azureml:CPU-ECONVDDA
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
      conda_file:
        name: vocab-prefix-sum-v3
        channels: [conda-forge]
        dependencies:
          - python=3.10
    code: ..
    inputs:
      reduced: ${{parent.jobs.vocab_reduce_parallel_fanout_boundary.outputs.reduced}}
      data_version: ${{parent.inputs.data_version}}
      layout_version: ${{parent.inputs.layout_version}}
    outputs:
      offsets: ${{parent.outputs.vocab_offsets}}
    command: >-
      python aml_dataprep/parallel/vocab_prefix_sum.py
      --reduced_root ${{inputs.reduced}}
      --output_dir ${{outputs.offsets}}
      --num_buckets 64
      --data_version ${{inputs.data_version}}
      --layout_version ${{inputs.layout_version}}

  vocab_finalize_parallel_fanout_boundary:
    type: command
    display_name: vocab-finalize-parallel-fanout-boundary
    compute: azureml:CPU-ECONVDDA
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
      conda_file:
        name: phase1-fanout-doc
        channels: [conda-forge]
        dependencies:
          - python=3.10
    code: ..
    inputs:
      reduced: ${{parent.jobs.vocab_reduce_parallel_fanout_boundary.outputs.reduced}}
      offsets: ${{parent.jobs.vocab_prefix_sum.outputs.offsets}}
    outputs:
      vocab: ${{parent.outputs.vocab}}
      markers: ${{parent.outputs.vocab_finalize_markers}}
    command: >-
      python aml_dataprep/parallel/run_smoke_subset.py
      --stage finalize
      --reduced_root ${{inputs.reduced}}
      --offsets_root ${{inputs.offsets}}
      --vocab_root ${{outputs.vocab}}
      --markers_out ${{outputs.markers}}
      --num_buckets 64

  parquet_parallel_fanout_boundary:
    type: command
    display_name: parquet-parallel-fanout-boundary
    compute: azureml:CPU-ECONVDDA
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
      conda_file:
        name: phase1-fanout-doc
        channels: [conda-forge]
        dependencies:
          - python=3.10
          - pip
          - pip:
              - "setuptools<81"
              - numpy
              - pandas
              - pyarrow
    code: ..
    inputs:
      discovered: ${{parent.jobs.discover_raw_shards.outputs.discovered}}
      raw: ${{parent.jobs.relay_parallel_fanout_boundary.outputs.raw}}
      vocab: ${{parent.jobs.vocab_finalize_parallel_fanout_boundary.outputs.vocab}}
      finalize_markers: ${{parent.jobs.vocab_finalize_parallel_fanout_boundary.outputs.markers}}
    outputs:
      seqview: ${{parent.outputs.seqview}}
    command: >-
      python aml_dataprep/parallel/run_smoke_subset.py
      --stage parquet
      --manifest ${{inputs.discovered}}/raw_source_manifest.jsonl
      --raw_root ${{inputs.raw}}
      --vocab_dir ${{inputs.vocab}}
      --seqview_out ${{outputs.seqview}}
      --num_buckets 64
      --max_train_shards 1
      --max_val_shards 1
      --mode all_events

  aggregate_seqview_manifest:
    type: command
    display_name: aggregate-seqview-manifest
    compute: azureml:CPU-D2ADSV4
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
      conda_file:
        name: seqview-manifest-v3
        channels: [conda-forge]
        dependencies:
          - python=3.10
    code: ..
    inputs:
      seqview: ${{parent.jobs.parquet_parallel_fanout_boundary.outputs.seqview}}
      vocab: ${{parent.jobs.vocab_finalize_parallel_fanout_boundary.outputs.vocab}}
      finalize_markers: ${{parent.jobs.vocab_finalize_parallel_fanout_boundary.outputs.markers}}
    outputs:
      metadata: ${{parent.outputs.seqview_metadata}}
    command: >-
      python aml_dataprep/parallel/aggregate_seqview_manifest.py
      --seqview_dir ${{inputs.seqview}}
      --vocab_dir ${{inputs.vocab}}
      --output_dir ${{outputs.metadata}}
      --mode all_events

  encode_embeddings:
    type: command
    display_name: encode-embeddings-smoke-v3
    compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
    resources:
      instance_type: Singularity.ND96rs_v4
      properties:
        s_vc: ads-relevance
        sla_tier: Premium
    environment: azureml:lrm-gpu-env:1
    code: ..
    inputs:
      vocab: ${{parent.jobs.vocab_finalize_parallel_fanout_boundary.outputs.vocab}}
      seqview_metadata: ${{parent.jobs.aggregate_seqview_manifest.outputs.metadata}}
    outputs:
      embeddings: ${{parent.outputs.embeddings}}
    command: >-
      pip install -q "sentence-transformers==5.4.1" && nvidia-smi --query-gpu=name --format=csv,noheader | head -1 && python aml_dataprep/encode_embeddings_multigpu_v3.py
      --vocab_dir ${{inputs.vocab}}
      --output_dir ${{outputs.embeddings}}
      --domains 0,1,2,3,4
      --batch_size 1024
      --model_name sentence-transformers/all-MiniLM-L6-v2
      --emb_dim 384

  train_3_epochs:
    type: command
    display_name: train-3-epochs-smoke-v3
    compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
    resources:
      instance_type: Singularity.ND96rs_v4
      properties:
        s_vc: ads-relevance
        sla_tier: Premium
    environment: azureml:lrm-gpu-env:1
    code: ..
    inputs:
      seqview: ${{parent.jobs.parquet_parallel_fanout_boundary.outputs.seqview}}
      seqview_metadata: ${{parent.jobs.aggregate_seqview_manifest.outputs.metadata}}
      embeddings: ${{parent.jobs.encode_embeddings.outputs.embeddings}}
    outputs:
      model: ${{parent.outputs.train_output}}
    command: >-
      bash -lc '
      set -euo pipefail;
      cp proposed_2-mmoe_ple/config/generated_m4_seq_len_50pct/m4_aux_light_hstu_50pct_l800.gin /tmp/train_3epochs.gin;
      sed -i "s/Trainer.num_epochs = [0-9][0-9]*/Trainer.num_epochs = 3/" /tmp/train_3epochs.gin;
      pip install -q -r proposed_2-mmoe_ple/requirements.txt 2>/dev/null || true; cd proposed_2-mmoe_ple/train; torchrun --nproc_per_node=8 main.py
      --gin_config_file=/tmp/train_3epochs.gin
      --data_path=${{inputs.seqview}}/train
      --ads_semantic_embd_path=${{inputs.embeddings}}/domain_0
      --web_browsing_semantic_embd_path=${{inputs.embeddings}}/domain_1
      --shopping_semantic_embd_path=${{inputs.embeddings}}/domain_2
      --ads_pure_corpus_embd_path=${{inputs.embeddings}}/domain_3
      --other_semantic_embd_path=${{inputs.embeddings}}/domain_4
      --output_path=${{outputs.model}}
      --mode=job
      --run_id=pconv_10shard_3epoch;
      '

  evaluate_model:
    type: command
    display_name: eval-model-smoke-v3
    compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
    resources:
      instance_type: Singularity.ND96rs_v4
      properties:
        s_vc: ads-relevance
        sla_tier: Premium
    environment: azureml:lrm-gpu-env:1
    code: ..
    inputs:
      seqview: ${{parent.jobs.parquet_parallel_fanout_boundary.outputs.seqview}}
      seqview_metadata: ${{parent.jobs.aggregate_seqview_manifest.outputs.metadata}}
      embeddings: ${{parent.jobs.encode_embeddings.outputs.embeddings}}
      model: ${{parent.jobs.train_3_epochs.outputs.model}}
    outputs:
      eval: ${{parent.outputs.eval_output}}
    command: >-
      bash -lc '
      set -euo pipefail;
      mkdir -p ${{outputs.eval}};
      cp proposed_2-mmoe_ple/config/generated_m4_seq_len_50pct/m4_aux_light_hstu_50pct_l800.gin /tmp/eval_3epochs.gin;
      sed -i "s/Trainer.num_epochs = [0-9][0-9]*/Trainer.num_epochs = 3/" /tmp/eval_3epochs.gin;
      CKPT=$(find ${{inputs.model}} -path "*ckpts*" -name "best_checkpoint_*.pt" -print | sort | tail -1);
      if [ -z "$CKPT" ]; then CKPT=$(find ${{inputs.model}} -path "*ckpts*" -name "checkpoint_batch*.pt" -print | sort | tail -1); fi;
      if [ -z "$CKPT" ]; then echo "No checkpoint found under ${{inputs.model}}" >&2; find ${{inputs.model}} -maxdepth 5 -type f >&2; exit 1; fi;
      echo "$CKPT" > ${{outputs.eval}}/checkpoint_path.txt;
      pip install -q -r proposed_2-mmoe_ple/requirements.txt 2>/dev/null || true; torchrun --standalone --nproc_per_node=1 eval/eval_per_event_type.py
      --gin_config_file=/tmp/eval_3epochs.gin
      --data_path=${{inputs.seqview}}/eval
      --ckpt_path="$CKPT"
      --ads_semantic_embd_path=${{inputs.embeddings}}/domain_0
      --web_browsing_semantic_embd_path=${{inputs.embeddings}}/domain_1
      --shopping_semantic_embd_path=${{inputs.embeddings}}/domain_2
      --ads_pure_corpus_embd_path=${{inputs.embeddings}}/domain_3
      --other_semantic_embd_path=${{inputs.embeddings}}/domain_4
      --eval_batches=100
      --output_json=${{outputs.eval}}/eval_per_event_type.json
      --mode=job;
      '
