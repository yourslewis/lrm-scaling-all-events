$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: lrm-l800-end2end
experiment_name: lrm-l800-pipeline
description: >-
  End-to-end LRM L800 reproduction on Azure ML. Split design: a cosmos->blob
  relay (on a cosmos-capable CPU compute) feeds GPU jobs on ads-shared-nd40 that
  never touch cosmos. Bump `data_version` to force the relay (and only the
  relay) to re-run when cosmos data changes; unchanged steps are reused.

settings:
  default_compute: azureml:serverless          # overridden per-step
  continue_on_step_failure: false

inputs:
  data_version: "v1-20260621"                  # bump to re-trigger relay

outputs:
  l800_output:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4/l800_output

jobs:

  # ---------- step 0: relay cosmos -> blob (cosmos-capable compute) ------------
  # NOTE: must run on a compute whose identity can read the cosmos ADLS datastore.
  # The compute instance lrm-smoke-submitter (its MSI) is verified cosmos-capable.
  # Singularity VC nodes CANNOT read cosmos, so the relay cannot run on nd40.
  relay:
    type: command
    compute: azureml:lrm-smoke-submitter        # compute instance w/ cosmos-capable MSI
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04:latest
      conda_file: ./env_relay.yml
    code: ..
    inputs:
      data_version: ${{parent.inputs.data_version}}
    outputs:
      raw:
        type: uri_folder
        mode: rw_mount
    command: >-
      python aml_dataprep/relay_shards.py
      --data_version ${{inputs.data_version}}
      --output_dir ${{outputs.raw}}

  # ---------- step 1: vocab (nd40 node, big RAM, reads raw from blob) ----------
  vocab:
    type: command
    compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
    resources:
      instance_type: Singularity.ND96rs_v4
      instance_count: 1
    queue_settings:
      job_tier: Standard
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04:latest
    code: ..
    inputs:
      raw: ${{parent.jobs.relay.outputs.raw}}
    outputs:
      vocab:
        type: uri_folder
        mode: rw_mount
    command: >-
      python data_prep/step1_collect_vocab_v2.py
      --train_dir ${{inputs.raw}}/train
      --val_dir ${{inputs.raw}}/val
      --output_dir ${{outputs.vocab}} &&
      cat ${{outputs.vocab}}/vocab_meta.json

  # ---------- step 2: parquet seqview (nd40 node, reads raw + vocab) -----------
  parquet:
    type: command
    compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
    resources:
      instance_type: Singularity.ND96rs_v4
      instance_count: 1
    queue_settings:
      job_tier: Standard
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04:latest
    code: ..
    inputs:
      raw: ${{parent.jobs.relay.outputs.raw}}
      vocab: ${{parent.jobs.vocab.outputs.vocab}}
    outputs:
      seqview:
        type: uri_folder
        mode: rw_mount
    command: >-
      python data_prep/step3_v2.py
      --vocab_dir ${{inputs.vocab}}
      --train_dir ${{inputs.raw}}/train
      --val_dir ${{inputs.raw}}/val
      --output_dir ${{outputs.seqview}}
      --mode all_events &&
      cat ${{outputs.seqview}}/metadata.json

  # ---------- step 3: encode semantic embeddings (8x A100) ---------------------
  encode:
    type: command
    compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
    resources:
      instance_type: Singularity.ND96rs_v4
      instance_count: 1
    queue_settings:
      job_tier: Standard
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04:latest
    code: ..
    inputs:
      vocab: ${{parent.jobs.vocab.outputs.vocab}}
    outputs:
      embeddings:
        type: uri_folder
        mode: rw_mount
    command: >-
      pip install -q "sentence-transformers==5.4.1" &&
      nvidia-smi --query-gpu=name --format=csv,noheader | head -1 &&
      python aml_dataprep/encode_embeddings_multigpu.py
      --vocab_dir ${{inputs.vocab}}
      --output_dir ${{outputs.embeddings}}
      --domains 0,1,2,3,4
      --batch_size 1024

  # ---------- step 4: L800 training (8x A100) ---------------------------------
  train:
    type: command
    compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
    resources:
      instance_type: Singularity.ND96rs_v4
      instance_count: 1
    queue_settings:
      job_tier: Standard
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04:latest
    code: ..
    inputs:
      seqview: ${{parent.jobs.parquet.outputs.seqview}}
      embeddings: ${{parent.jobs.encode.outputs.embeddings}}
    outputs:
      output: ${{parent.outputs.l800_output}}
    command: >-
      pip install -q -r proposed_2-mmoe_ple/requirements.txt 2>/dev/null || true &&
      cd proposed_2-mmoe_ple/train &&
      torchrun --nproc_per_node=8 main.py
      --gin_config_file=../config/generated_m4_seq_len_50pct/m4_aux_light_hstu_50pct_l800.gin
      --output_path=${{outputs.output}}
      --data_path=${{inputs.seqview}}/train
      --mode=job
      --ads_semantic_embd_path=${{inputs.embeddings}}/domain_0
      --web_browsing_semantic_embd_path=${{inputs.embeddings}}/domain_1
      --shopping_semantic_embd_path=${{inputs.embeddings}}/domain_2
      --ads_pure_corpus_embd_path=${{inputs.embeddings}}/domain_3
      --other_semantic_embd_path=${{inputs.embeddings}}/domain_4
