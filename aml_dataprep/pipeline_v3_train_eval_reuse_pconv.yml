$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json

type: pipeline
display_name: lrm-l800-pconv-v3-train-eval-reuse-prep
experiment_name: lrm-l800-pconv-v3-train-eval

description: >-
  Reuse the completed 10-shard pconv parallel-prep outputs from neat_jackal_xx387zbfbz,
  encode embeddings from the sharded vocab, train for a configurable number of epochs,
  and run per-event-type evaluation.

inputs:
  num_epochs: 3

outputs:
  embeddings:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/train_eval_reuse/neat_jackal_xx387zbfbz/epochs_param/embeddings
  train_output:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/train_eval_reuse/neat_jackal_xx387zbfbz/epochs_param/train_output
  eval_output:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/train_eval_reuse/neat_jackal_xx387zbfbz/epochs_param/eval_output

settings:
  default_datastore: azureml:workspaceblobstore
  continue_on_step_failure: false

jobs:
  encode_embeddings:
    type: command
    display_name: encode-embeddings-from-neat-jackal-vocab
    compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
    resources:
      instance_type: Singularity.ND96rs_v4
      properties:
        s_vc: ads-relevance
        sla_tier: Premium
    environment: azureml:lrm-gpu-env:1
    code: ..
    inputs:
      vocab:
        type: uri_folder
        path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/v3-20260625-pconv-parallel-prep-10shards-econrelay-181406/layout_v1/vocab
    outputs:
      embeddings: ${{parent.outputs.embeddings}}
    command: >-
      set -e &&
      pip install -q "sentence-transformers==5.4.1" &&
      nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader &&
      python aml_dataprep/encode_embeddings_multigpu_v3.py
      --vocab_dir ${{inputs.vocab}}
      --output_dir ${{outputs.embeddings}}
      --domains 0,1,2,3,4
      --batch_size 1024
      --model_name sentence-transformers/all-MiniLM-L6-v2
      --emb_dim 384

  train:
    type: command
    display_name: train-configurable-epochs-from-neat-jackal-seqview
    compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
    resources:
      instance_type: Singularity.ND96rs_v4
      properties:
        s_vc: ads-relevance
        sla_tier: Premium
    environment: azureml:lrm-gpu-env:1
    code: ..
    inputs:
      seqview:
        type: uri_folder
        path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/v3-20260625-pconv-parallel-prep-10shards-econrelay-181406/layout_v1/seqview
      seqview_metadata:
        type: uri_folder
        path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/v3-20260625-pconv-parallel-prep-10shards-econrelay-181406/layout_v1/seqview_metadata
      embeddings: ${{parent.jobs.encode_embeddings.outputs.embeddings}}
      num_epochs: ${{parent.inputs.num_epochs}}
    outputs:
      model: ${{parent.outputs.train_output}}
    command: >-
      set -e &&
      (pip install -q -r proposed_2-mmoe_ple/requirements.txt 2>/dev/null || true) &&
      cp proposed_2-mmoe_ple/config/generated_m4_seq_len_50pct/m4_aux_light_hstu_50pct_l800.gin /tmp/train_epochs.gin &&
      sed -i "s/Trainer.num_epochs = [0-9][0-9]*/Trainer.num_epochs = ${{inputs.num_epochs}}/" /tmp/train_epochs.gin &&
      cd proposed_2-mmoe_ple/train &&
      torchrun --nproc_per_node=8 main.py
      --gin_config_file=/tmp/train_epochs.gin
      --data_path=${{inputs.seqview}}/train
      --ads_semantic_embd_path=${{inputs.embeddings}}/domain_0
      --web_browsing_semantic_embd_path=${{inputs.embeddings}}/domain_1
      --shopping_semantic_embd_path=${{inputs.embeddings}}/domain_2
      --ads_pure_corpus_embd_path=${{inputs.embeddings}}/domain_3
      --other_semantic_embd_path=${{inputs.embeddings}}/domain_4
      --output_path=${{outputs.model}}
      --mode=job
      --run_id=pconv_10shard_epochs_${{inputs.num_epochs}}

  evaluate:
    type: command
    display_name: eval-configurable-epochs-from-neat-jackal-seqview
    compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
    resources:
      instance_type: Singularity.ND96rs_v4
      properties:
        s_vc: ads-relevance
        sla_tier: Premium
    environment: azureml:lrm-gpu-env:1
    code: ..
    inputs:
      seqview:
        type: uri_folder
        path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/v3-20260625-pconv-parallel-prep-10shards-econrelay-181406/layout_v1/seqview
      seqview_metadata:
        type: uri_folder
        path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/v3-20260625-pconv-parallel-prep-10shards-econrelay-181406/layout_v1/seqview_metadata
      embeddings: ${{parent.jobs.encode_embeddings.outputs.embeddings}}
      model: ${{parent.jobs.train.outputs.model}}
      num_epochs: ${{parent.inputs.num_epochs}}
    outputs:
      eval: ${{parent.outputs.eval_output}}
    command: >-
      set -e &&
      mkdir -p ${{outputs.eval}} &&
      (pip install -q -r proposed_2-mmoe_ple/requirements.txt 2>/dev/null || true) &&
      cp proposed_2-mmoe_ple/config/generated_m4_seq_len_50pct/m4_aux_light_hstu_50pct_l800.gin /tmp/eval_epochs.gin &&
      sed -i "s/Trainer.num_epochs = [0-9][0-9]*/Trainer.num_epochs = ${{inputs.num_epochs}}/" /tmp/eval_epochs.gin &&
      CKPT=$(find ${{inputs.model}} -path "*ckpts*" -name "best_checkpoint_*.pt" -print | sort | tail -1) &&
      if [ -z "$CKPT" ]; then CKPT=$(find ${{inputs.model}} -path "*ckpts*" -name "checkpoint_batch*.pt" -print | sort | tail -1); fi &&
      if [ -z "$CKPT" ]; then echo "No checkpoint found under ${{inputs.model}}" >&2; find ${{inputs.model}} -maxdepth 5 -type f >&2; exit 1; fi &&
      echo "$CKPT" > ${{outputs.eval}}/checkpoint_path.txt &&
      torchrun --standalone --nproc_per_node=1 eval/eval_per_event_type.py
      --gin_config_file=/tmp/eval_epochs.gin
      --data_path=${{inputs.seqview}}/eval
      --ckpt_path="$CKPT"
      --ads_semantic_embd_path=${{inputs.embeddings}}/domain_0
      --web_browsing_semantic_embd_path=${{inputs.embeddings}}/domain_1
      --shopping_semantic_embd_path=${{inputs.embeddings}}/domain_2
      --ads_pure_corpus_embd_path=${{inputs.embeddings}}/domain_3
      --other_semantic_embd_path=${{inputs.embeddings}}/domain_4
      --eval_batches=100
      --output_json=${{outputs.eval}}/eval_per_event_type.json
      --mode=job
