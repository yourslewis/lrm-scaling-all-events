display_name: lrm-l800-pconv-v3-fullgraph-v68-mi200-same-as-v52-template
experiment_name: lrm-l800-pconv-v3-fullgraph-mi200
description: 'MI200 variant of NVIDIA v52 template: relay/vocab/seqview/encode graph unchanged; train/eval nodes use current ROCm-compatible code and Feeds MI200 resources.'
outputs:
  train_epoch1_output:
    type: uri_folder
    mode: upload
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/full_graph_20260709_v68_mi200_same_as_v52_template/04_train_epoch1_output
  eval_epoch1_output:
    type: uri_folder
    mode: upload
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4_pconv_v3/full_graph_20260709_v68_mi200_same_as_v52_template/05_eval_epoch1_output
