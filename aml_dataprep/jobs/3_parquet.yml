$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# ---------------------------------------------------------------------------
# Job 3/3: Build the parquet seqview (train/ + eval/) from raw shards + vocab.
# Reads:  raw TSV shards (cosmos) + vocab (Job 1)
# Writes: workspace blobstore  derived/lrm_v4/seqview_v001
#         -> train/part_XXXX.parquet (one per train chunk) + eval/part_0000.parquet
#         encoded_ids = domain*1e9 + item_id  (matches the embedding shards)
# CPU job. This is the data_path the L800 training reads.
# ---------------------------------------------------------------------------
display_name: lrm-dataprep-3-parquet
experiment_name: lrm-dataprep

compute: /subscriptions/72a1fe05-772c-4836-869f-761a5805fcd4/resourceGroups/Ads-Singularity-RG-01/providers/Microsoft.MachineLearningServices/virtualClusters/ads-shared-nd40
resources:
  instance_type: Singularity.ND96rs_v4
  instance_count: 1
queue_settings:
  job_tier: Standard

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04:latest

code: ..

inputs:
  train:
    type: uri_folder
    mode: ro_mount
    path: azureml://subscriptions/72a0fe10-0a76-4898-9b7b-640e6e236fdc/resourcegroups/wb-aml/workspaces/pconv-aml-offline/datastores/bingads_algo_pipelines_c08/paths/local/User/wenhlu/LRM_benchmark_v4/train
  val:
    type: uri_folder
    mode: ro_mount
    path: azureml://subscriptions/72a0fe10-0a76-4898-9b7b-640e6e236fdc/resourcegroups/wb-aml/workspaces/pconv-aml-offline/datastores/bingads_algo_pipelines_c08/paths/local/User/wenhlu/LRM_benchmark_v4/val
  vocab:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4/vocab_v3

outputs:
  seqview:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/derived/lrm_v4/seqview_v001

command: >-
  set -e &&
  python data_prep/step3_v2.py
  --vocab_dir ${{inputs.vocab}}
  --train_dir ${{inputs.train}}
  --val_dir ${{inputs.val}}
  --output_dir ${{outputs.seqview}}
  --mode all_events &&
  echo "=== metadata.json ===" && cat ${{outputs.seqview}}/metadata.json &&
  echo "train parts: $(ls ${{outputs.seqview}}/train/*.parquet | wc -l)" &&
  echo "eval parts:  $(ls ${{outputs.seqview}}/eval/*.parquet | wc -l)"
